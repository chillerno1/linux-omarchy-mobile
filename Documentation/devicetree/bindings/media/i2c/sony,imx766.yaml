%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/sony,imx766.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Sony IMX766 Image Sensor

maintainers:
  - chillerno1 <gh.chiller@pm.me>

description:
  The Sony IMX766 is a CMOS image sensor with a MIPI CSI-2 output,
  controlled through an I2C-compatible interface.

allOf:
  - $ref: /schemas/media/video-interface-devices.yaml#

properties:
  compatible:
    const: sony,imx766

  reg:
    maxItems: 1

  clocks:
    description: External clock (INCK), 24 MHz.
    maxItems: 1

  dovdd-supply:
    description: Interface (I/O) supply, 1.8 V.

  avdd-supply:
    description: Analog supply, 2.8 V.

  avdd2-supply:
    description: Second analog supply, 1.8 V.

  dvdd-supply:
    description: Digital core supply.

  reset-gpios:
    description: GPIO connected to the XCLR pin, active low.
    maxItems: 1

  power-domains:
    description:
      Power domain the external clock depends on, where the clock comes
      from a camera clock controller.
    maxItems: 1

  port:
    $ref: /schemas/graph.yaml#/$defs/port-base
    additionalProperties: false

    properties:
      endpoint:
        $ref: /schemas/media/video-interfaces.yaml#
        unevaluatedProperties: false

        properties:
          data-lanes:
            minItems: 1
            maxItems: 4

          link-frequencies: true

        required:
          - data-lanes
          - link-frequencies

required:
  - compatible
  - reg
  - clocks
  - dovdd-supply
  - avdd-supply
  - avdd2-supply
  - dvdd-supply

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        camera@29 {
            compatible = "sony,imx766";
            reg = <0x29>;

            clocks = <&cam_mclk>;
            assigned-clocks = <&cam_mclk>;
            assigned-clock-rates = <24000000>;

            dovdd-supply = <&vreg_dovdd>;
            avdd-supply = <&vreg_avdd>;
            avdd2-supply = <&vreg_avdd2>;
            dvdd-supply = <&vreg_dvdd>;

            reset-gpios = <&tlmm 24 GPIO_ACTIVE_LOW>;

            orientation = <1>;
        };
    };
...
