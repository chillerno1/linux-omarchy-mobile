%YAML 1.2
---
$id: http://devicetree.org/schemas/input/betterlife,bf83112.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Betterlife BF83112 capacitive fingerprint sensor

maintainers:
  - chillerno1 <gh.chiller@pm.me>

description: |
  The BF83112 is a capacitive fingerprint sensor with an SPI interface, a
  reset input and an interrupt output.

  On the phones it is found in, the SPI interface is owned by the secure
  world: the trusted firmware drives the bus and reads the images, and the
  bus controller is not available to Linux. This node is therefore not a
  child of an SPI bus. It describes only the lines Linux drives: the
  supply, the reset line and the interrupt line.

properties:
  compatible:
    const: betterlife,bf83112

  interrupts:
    maxItems: 1
    description: Finger detect interrupt, active high.

  reset-gpios:
    maxItems: 1

  vcc-supply:
    description: Sensor supply.

  wakeup-source: true

required:
  - compatible
  - interrupts
  - reset-gpios
  - vcc-supply

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    fingerprint {
        compatible = "betterlife,bf83112";
        interrupts-extended = <&tlmm 40 IRQ_TYPE_EDGE_RISING>;
        reset-gpios = <&tlmm 41 GPIO_ACTIVE_LOW>;
        vcc-supply = <&vreg_l11c_3p0>;
    };
